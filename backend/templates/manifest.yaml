apiVersion: v1
kind: ConfigMap
metadata:
  name: backend
  namespace: expense
data:
  DB_HOST: {{ .values.ConfigMap.DB_HOST }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: expense
  labels:
    app: backend
    tier: api
    project: expense
spec:
  replicas: {{ .values.deployment.replicas }}
  selector:
    matchLabels:
      app: backend
      tier: api
      project: expense
  template:
    metadata:
      labels:
        app: backend
        tier: api
        project: expense
    spec:
      containers:
      - name: backend
        image: chaitanyaj293/backend:{{ .values.deployment.imageversion }}
        resources:
          requests:
            cpu: {{ .values.deployment.cpu }}
            memory: {{ .values.deployment.memory }}
          limits:
            cpu: {{ .values.deployment.cpu }}
            memory: {{ .values.deployment.memory }}
        envFrom:
        - configMapRef:
            name: backend

---
kind: Service
apiVersion: v1
metadata:
  name: backend
  namespace: expense
spec:
  selector:
    app: backend
    tier: api
    project: expense
  ports:
  - name: backend-svc-port
    protocol: TCP
    port: {{ .values.service.port }}
    targetPort: {{ .values.service.targetPort }}
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
 name: backend
 namespace: expense
spec:
 scaleTargetRef:
   apiVersion: apps/v1
   kind: Deployment
   name: backend
 minReplicas: 1
 maxReplicas: 10
 targetCPUUtilizationPercentage: {{ .values.hpa.targetCPUUtilizationPercentage }} # usually 75 in real environment
